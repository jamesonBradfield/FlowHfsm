<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333b4f" />
      <stop offset="100%" stop-color="#202531" />
    </linearGradient>
    <linearGradient id="state1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#478cbf" />
      <stop offset="100%" stop-color="#2e5c80" />
    </linearGradient>
    <linearGradient id="state2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41c99f" />
      <stop offset="100%" stop-color="#2a8569" />
    </linearGradient>
    <linearGradient id="state3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c94178" />
      <stop offset="100%" stop-color="#852a4b" />
    </linearGradient>
  </defs>

  <!-- Outer background -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)" stroke="#478cbf" stroke-width="8"/>

  <!-- Super State (Hierarchy container) -->
  <rect x="48" y="48" width="160" height="112" rx="16" fill="rgba(71, 140, 191, 0.15)" stroke="#609bd1" stroke-width="6" stroke-dasharray="10 6" />

  <!-- Sub State 1 -->
  <rect x="64" y="72" width="48" height="48" rx="12" fill="url(#state1)" />
  
  <!-- Sub State 2 -->
  <rect x="144" y="72" width="48" height="48" rx="12" fill="url(#state2)" />

  <!-- Transition Sub 1 -> Sub 2 -->
  <path d="M 112 96 L 135 96" fill="none" stroke="#e0e0e0" stroke-width="6" stroke-linecap="round" />
  <polygon points="144,96 134,90 134,102" fill="#e0e0e0" />

  <!-- External State -->
  <rect x="104" y="180" width="48" height="48" rx="12" fill="url(#state3)" />

  <!-- Transition Super State -> External State -->
  <path d="M 128 160 L 128 171" fill="none" stroke="#e0e0e0" stroke-width="6" stroke-linecap="round" />
  <polygon points="128,180 122,170 134,170" fill="#e0e0e0" />
</svg>